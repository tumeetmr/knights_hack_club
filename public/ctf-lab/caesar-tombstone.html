<!doctype html><html lang="en"><head><title>Caesar's Tombstone</title><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex">
<style>
body{font-family:system-ui,sans-serif;background:radial-gradient(60rem 40rem at 80% -10%,#3b1360,transparent 60%),#0c0614;color:#fff;margin:0;padding:24px 16px 48px;text-align:center;line-height:1.5}
main{max-width:520px;margin:0 auto}
.stone{margin:24px auto 0;max-width:340px;background:linear-gradient(#6b6478,#3f3a49);border-radius:170px 170px 16px 16px;padding:56px 24px 32px;box-shadow:inset 0 -8px 0 #00000040,0 20px 40px #0008;color:#e9e4f0}
.stone p{margin:.3em 0}
.carved{font-family:ui-monospace,Menlo,monospace;font-size:1.2rem;font-weight:800;letter-spacing:.04em;word-break:break-all;color:#fff;text-shadow:0 1px 0 #0008}
.muted{color:#ffffff99;font-size:.9rem}
.wheel{background:#ffffff12;border:1px solid #ffffff1f;border-radius:20px;padding:16px;margin-top:24px}
.row{display:flex;align-items:center;justify-content:center;gap:12px;margin-top:8px}
button{font:inherit;font-weight:800;font-size:1.5rem;border:0;border-radius:999px;background:#fb923c;color:#160b22;width:56px;height:56px;cursor:pointer}
#n{font-size:2.5rem;font-weight:900;min-width:3ch;font-variant-numeric:tabular-nums}
#out{font-family:ui-monospace,Menlo,monospace;font-size:1.15rem;font-weight:700;background:#000;border-radius:12px;padding:12px;margin-top:12px;word-break:break-all;user-select:all;-webkit-user-select:all}
</style></head>
<body><main>
<h1>🪦 Caesar's Tombstone</h1>
<p class="muted">Rome, 44 BC. Somehow it ended up in our school's backyard.</p>
<div class="stone">
<p style="font-weight:800;letter-spacing:.2em">HERE LIES</p>
<p style="font-size:1.3rem;font-weight:900">GAIUS JULIUS CAESAR</p>
<p class="muted" style="color:#e9e4f0b0">He always marched exactly <b>7</b> steps ahead of his enemies.</p>
<p class="carved">RO{clup_cpkp_zwvvrf}</p>
</div>
<div class="wheel">
<p style="margin:0;font-weight:700">🎡 The Decoder Wheel</p>
<p class="muted" style="margin:.2em 0 0">Moves every letter <i>back</i> through the alphabet. Numbers and symbols stay the same.</p>
<div class="row"><button type="button" id="dn" aria-label="Turn back one less">−</button><span id="n" aria-live="polite">0</span><button type="button" id="up" aria-label="Turn back one more">+</button></div>
<div id="out"></div>
</div>
</main>
<script>
const text = "RO{clup_cpkp_zwvvrf}";
let n = 0;
const shift = (c, base) => String.fromCharCode(((c.charCodeAt(0) - base - n + 26) % 26) + base);
const draw = () => {
  document.getElementById("n").textContent = n;
  document.getElementById("out").textContent = text.replace(/[a-z]/g, (c) => shift(c, 97)).replace(/[A-Z]/g, (c) => shift(c, 65));
};
document.getElementById("up").onclick = () => { n = (n + 1) % 26; draw(); };
document.getElementById("dn").onclick = () => { n = (n + 25) % 26; draw(); };
draw();
</script>
</body></html>
